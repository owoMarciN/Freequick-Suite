name: shared_assets
description: Common assets shared across apps.
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_libphonenumber: ^2.7.0
  fancy_password_field: ^2.0.8
  phone_form_field: ^10.0.17
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.0.6

dev_dependencies:
  auto_translator: ^2.3.2

flutter:
  generate: true
  assets:
    - images/
    
  fonts:
    - family: Acme
      fonts:
        - asset: fonts/Acme-Regular.ttf
    - family: Kiwi
      fonts:
        - asset: fonts/KiwiMaru-Medium.ttf
    - family: Signatra
      fonts:
        - asset: fonts/Signatra.ttf
    - family: Train
      fonts:
        - asset: fonts/TrainOne-Regular.ttf