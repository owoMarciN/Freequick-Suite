name: rider_app
description: Delivery Rider APP. Part of the Freequick-Suite.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_assets:
    path: ../shared_assets
  intl: ^0.20.2

  # Firebase
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_messaging: ^16.1.3
  firebase_storage: ^13.2.0
  cloud_functions: ^6.1.0       

  # Maps & Location
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0
  permission_handler: ^11.1.0

  # State management
  provider: ^6.1.1

  # UI
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # Notifications
  flutter_local_notifications: ^17.1.2

  # Utils

  shared_preferences: ^2.2.2
  url_launcher: ^6.2.2
  fancy_password_field: ^2.0.8
  phone_form_field: ^10.0.17
  country_flags: ^4.1.2
  auto_translator: ^2.3.5
  easy_localization: ^3.0.1
  flutter_libphonenumber: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

